[workspace]
members = [
  "crates/protocol",
  "crates/shared",
  "crates/server",
  "crates/client",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["khalr"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1.6"
